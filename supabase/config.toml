project_id = "community-gear-lending"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true

[functions.sanitize-gear-image]
verify_jwt = true

[functions.draft-gear-listing]
verify_jwt = true

[functions.deliver-transactional-notifications]
verify_jwt = false

[functions.receive-ses-feedback]
verify_jwt = false

[functions.invite-preapproved-member]
verify_jwt = true

[functions.delete-deactivated-member]
verify_jwt = true
